name: brick_vpn_workspace
publish_to: none

environment:
  sdk: ">=3.6.0 <4.0.0"

workspace:
  - apps/mobile
  - packages/core_domain
  - packages/core_vpn_engine
  - packages/config_parser
  - packages/ui_theme
  - packages/shared_utils
  # P3-T11: the native Gate A engine, now a Flutter Android platform plugin.
  # NOTE: this package depends on Flutter, so it must appear in `test:flutter`
  # → `ignore:` below (it has no `test/` dir yet, but the dual-list rule
  # documented below requires both edits together for every new package).
  - packages/vpn_engine_android

dev_dependencies:
  melos: ^8.9.0

melos:
  command:
    bootstrap:
      usePubspecOverrides: true

  scripts:
    analyze:
      description: Run static analysis across all packages
      run: melos exec -- flutter analyze .

    format:
      description: Check code formatting across all packages
      run: melos exec -- dart format --set-exit-if-changed .

    # `test` is a composite script that dispatches to two sub-scripts
    # based on whether a package is pure Dart or depends on Flutter.
    # Pure-Dart packages MUST be tested with `dart test` (not
    # `flutter test`) to prove they have no Flutter dependency — this
    # is a load-bearing architectural invariant (see ARCHITECTURE.md
    # Section 3 on the VpnEngine abstraction and its pure-Dart
    # contract packages).
    #
    # ADDING A NEW PURE-DART PACKAGE requires TWO edits below, in the
    # SAME COMMIT that removes the package's Flutter dependency:
    #   1. Add the package name to `test:dart` → `scope:` (allowlist).
    #   2. Add the same name to `test:flutter` → `ignore:` (denylist).
    # Both edits are required. If only step 1 is done, the package is
    # tested twice (once by each sub-script). If only step 2 is done,
    # the package is not tested at all. This dual-list design is
    # deliberate: Melos has no built-in "detect Flutter dependency"
    # primitive, so explicit opt-in routing is the simplest correct
    # solution — but it costs one small manual sync step per new
    # pure-Dart package. Planned pure-Dart packages that will need
    # this treatment: `core_domain` (P1-T2, done), `core_vpn_engine` (P1-T4, done).
    # `config_parser` was added in Phase 2 (P2-T1).
    test:
      description: Run all tests, routing pure-Dart packages to `dart test` and Flutter packages to `flutter test`.
      steps:
        - test:dart
        - test:flutter

    test:dart:
      description: Run `dart test` for pure-Dart packages (no Flutter dependency).
      run: melos exec -- dart test
      packageFilters:
        dirExists: test
        scope:
          - shared_utils
          - core_domain
          - core_vpn_engine
          - config_parser
          # P3-T11 — deliberate ABSENCE, documented deliberately.
          # `vpn_engine_android` is a FLUTTER package, so it must NOT be routed
          # to `dart test`. The dual-list rule above states the pairing for a new
          # **pure-Dart** package ("present in `scope:` + present in `ignore:`").
          # For a Flutter package the correct pairing is the mirror image:
          # **absent from `scope:` + present in `ignore:`** (edit made below).
          # Adding it here would make `dart test` run against a package that
          # imports `dart:ui`, breaking the load-bearing "pure-Dart packages have
          # no Flutter dependency" invariant documented above.

    test:flutter:
      description: Run `flutter test` for packages that depend on Flutter.
      run: melos exec -- flutter test
      packageFilters:
        dirExists: test
        ignore:
          - shared_utils
          - core_domain
          - core_vpn_engine
          - config_parser
          # P3-T11: dual-list rule edit #2 of 2 for vpn_engine_android. It is a
          # Flutter package, so it must NOT be routed to `dart test`. Paired
          # with the `test:dart` → `scope:` edit above AND the `workspace:` entry
          # — all three are required together, per the rule documented above.
          - vpn_engine_android
