#
# Brick VPN Dependabot Configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Dart and Flutter dependencies across the monorepo workspace
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"

  # Android Gradle dependencies for apps/mobile
  - package-ecosystem: "gradle"
    directory: "/apps/mobile/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-android)"

  # Android Gradle dependencies for packages/vpn_engine_android
  - package-ecosystem: "gradle"
    directory: "/packages/vpn_engine_android/android"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-engine)"

  # GitHub Actions workflows and actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
