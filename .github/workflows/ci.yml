# Brick VPN CI
# Pinned Flutter version: 3.47.4 (Dart 3.13.3), verified on 2026-09-16.
# Version bumps must be handled by a dedicated roadmap task with full
# validation; do not change this pin silently in an unrelated task.

name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
          pub-cache: true

      - name: Install Melos
        run: |
          dart pub global activate melos 8.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Check formatting
        run: melos run format --no-select

      - name: Analyze workspace
        run: melos run analyze --no-select

      - name: Test workspace
        run: melos run test --no-select

      - name: Verify checksum generation script
        run: |
          chmod +x scripts/generate_and_verify_checksums.sh
          TEST_TMP=$(mktemp -d)
          echo "test-payload" > "$TEST_TMP/app-release.apk"
          ./scripts/generate_and_verify_checksums.sh "$TEST_TMP"
          test -f "$TEST_TMP/SHA256SUMS.txt"
          rm -rf "$TEST_TMP"

      - name: Set up Java 17
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Provision release keystore from secrets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Error: Release signing secrets are not configured in GitHub Actions." >&2
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/brickvpn-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "BRICK_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "BRICK_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BRICK_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "BRICK_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Ensure libbox.aar native engine binary is built
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ ! -f packages/vpn_engine_android/android/libs/libbox.aar ]; then
            packages/vpn_engine_android/scripts/build_libbox_aar.sh
          fi
          test -s packages/vpn_engine_android/android/libs/libbox.aar

      - name: Build release Split-ABI APKs, Universal APK, and App Bundle
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd apps/mobile
          flutter build apk --release --split-per-abi
          flutter build apk --release
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/flutter-apk/app-release.aab

      - name: Verify R8 seeds.txt and Dual-Distribution ABI packaging
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERIFY_RELEASE_ARTIFACTS: 'true'
        run: |
          cd apps/mobile
          flutter test --no-pub -r expanded test/proguard_r8_hardening_test.dart

      - name: Verify release APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          APKSIGNER_BIN=$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1)
          for apk in apps/mobile/build/app/outputs/flutter-apk/*.apk; do
            echo "Verifying signature for $apk"
            SIGNATURE_OUTPUT=$("$APKSIGNER_BIN" verify --print-certs -v "$apk")
            echo "$SIGNATURE_OUTPUT"
            echo "$SIGNATURE_OUTPUT" | grep -q "563daf7196c565ad432bf5800e2a9eaae0a10918b0489e7965e63d973827303b"
          done
          echo "Verifying signature for app-release.aab"
          AAB_CERT=$(keytool -printcert -jarfile apps/mobile/build/app/outputs/bundle/release/app-release.aab)
          echo "$AAB_CERT"
          echo "$AAB_CERT" | grep -q "56:3D:AF:71:96:C5:65:AD:43:2B:F5:80:0E:2A:9E:AA:E0:A1:09:18:B0:48:9E:79:65:E6:3D:97:38:27:30:3B"

      - name: Generate and verify release checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/generate_and_verify_checksums.sh apps/mobile/build/app/outputs/flutter-apk

      - name: Wipe ephemeral release keystore
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: |
          rm -f "$RUNNER_TEMP/brickvpn-release.jks"

      - name: Upload release artifacts and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-and-checksums
          path: |
            apps/mobile/build/app/outputs/flutter-apk/*.apk
            apps/mobile/build/app/outputs/bundle/release/*.aab
            apps/mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
