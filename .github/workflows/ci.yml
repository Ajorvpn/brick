# Brick VPN CI
# Pinned Flutter version: 3.47.4 (Dart 3.13.3), verified on 2026-09-16.
# Version bumps must be handled by a dedicated roadmap task with full
# validation; do not change this pin silently in an unrelated task.

name: CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
          pub-cache: true

      - name: Install Melos
        run: |
          dart pub global activate melos 8.7.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Check formatting
        run: melos run format --no-select

      - name: Analyze workspace
        run: melos run analyze --no-select

      - name: Test workspace
        run: melos run test --no-select

      - name: Verify checksum generation script
        run: |
          chmod +x scripts/generate_and_verify_checksums.sh
          TEST_TMP=$(mktemp -d)
          echo "test-payload" > "$TEST_TMP/app-release.apk"
          ./scripts/generate_and_verify_checksums.sh "$TEST_TMP"
          test -f "$TEST_TMP/SHA256SUMS.txt"
          rm -rf "$TEST_TMP"

      - name: Set up Java 17
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd apps/mobile
          flutter build apk --release

      - name: Generate and verify release checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ./scripts/generate_and_verify_checksums.sh apps/mobile/build/app/outputs/flutter-apk

      - name: Upload release artifacts and checksums
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-apks-and-checksums
          path: |
            apps/mobile/build/app/outputs/flutter-apk/*.apk
            apps/mobile/build/app/outputs/flutter-apk/SHA256SUMS.txt
